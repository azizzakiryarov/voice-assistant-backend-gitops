# Image tags are written by the Tekton pipeline (task update-gitops-image-tag)
# after a successful build. Argo CD rolls out the new pods when a tag changes.
images:
  backend:
    repository: azizzakiryarov/voice-assistant-backend
    tag: latest
  frontend:
    repository: azizzakiryarov/voice-assistant-frontend
    tag: latest

ingress:
  localHosts:
    - raspberrypi.local
  hosts:
    - voice-assistant.duckdns.org
  tls:
    enabled: true
    secretName: voice-assistant-duckdns-tls
    hosts:
      - voice-assistant.duckdns.org

certManager:
  clusterIssuer:
    enabled: true
    name: letsencrypt-prod
    email: zakiryarov@hotmail.com

app:
  frontendUrl: https://voice-assistant.duckdns.org/
